name: Kemet Travel CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-and-security:
    name: Typecheck, Unit Tests, Rules Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run TypeScript typecheck
        run: npm run lint

      - name: Lint Firestore security rules
        run: npx eslint firestore.rules

      - name: Run pure logic unit tests
        run: npx tsx --test src/utils/bookingLogic.test.ts

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Build production bundle
        run: npm run build

      - name: Verify production bundle & static assets
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -d dist/images/egypt

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: kemet-travel-dist
          path: dist/
          retention-days: 7
