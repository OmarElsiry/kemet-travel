name: Deploy Kemet Travel to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify Static Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript typecheck
        run: npm run lint

      - name: Run pure logic unit tests
        run: npx tsx --test src/utils/bookingLogic.test.ts

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build production bundle with Pages base path
        env:
          VITE_BASE_PATH: "/${{ github.event.repository.name }}/"
          VITE_SALES_PHONE: ${{ vars.VITE_SALES_PHONE }}
          VITE_SALES_WHATSAPP: ${{ vars.VITE_SALES_WHATSAPP }}
          VITE_SALES_EMAIL: ${{ vars.VITE_SALES_EMAIL }}
        run: npm run build

      - name: Verify built entry and 404 SPA fallback exist
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -d dist/images/egypt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    name: Publish to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
