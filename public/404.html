<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kemet Travel — Welcome to Egypt</title>
    <script>
      // Standard single-page app redirect for GitHub Pages subpath or root deployment
      var l = window.location;
      var segments = l.pathname.split('/').filter(Boolean);
      var knownAppRoutes = ['stays', 'account', 'sales', 'bookings', 'where-to-go'];
      var pathSegmentsToKeep = segments.length > 0 && knownAppRoutes.indexOf(segments[0]) === -1 ? 1 : 0;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
